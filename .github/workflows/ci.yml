name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: footnote
          POSTGRES_PASSWORD: footnote
          POSTGRES_DB: footnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U footnote -d footnote_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # No secrets: every provider runs in fake mode and .env is never read.
      FOOTNOTE_DISABLE_DOTENV: "1"
      LLM_PROVIDER: fake
      EMBEDDER: fake
      DART_PROVIDER: fake
      DATABASE_URL: postgresql+asyncpg://footnote:footnote@localhost:5432/footnote_test
      TEST_DATABASE_URL: postgresql+asyncpg://footnote:footnote@localhost:5432/footnote_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
